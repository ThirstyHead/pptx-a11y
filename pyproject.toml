[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-a11y"
version = "0.5.0"
description = "Audit and remediate PowerPoint .pptx presentations against WCAG 2.2 AA (headless, deterministic)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pptx-a11y contributors" }]
keywords = ["accessibility", "wcag", "wcag22", "powerpoint", "pptx", "presentationml", "audit", "remediation"]
dependencies = [
    "engine-a11y @ git+https://github.com/ThirstyHead/engine-a11y.git@v0.4.0",
    "python-pptx>=1.0.0",
    "lxml>=4.9",
    "wcag-contrast-ratio>=0.9,<1",
    "markdown>=3.6,<4",
    "pymupdf>=1.24",
    "pikepdf>=9.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",
]
dev = [
    "PySide6>=6.5",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.5.0",
]
all = [
    "pptx-a11y[dev,gui]",
]

[project.scripts]
pptx-a11y = "pptx_a11y.cli:main"
pptx-a11y-gui = "pptx_a11y.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pptx_a11y = [
    "sc_cache.json",
    "reports/themes/**/*.css",
    "reports/themes/**/*.json",
    "reports/themes/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
